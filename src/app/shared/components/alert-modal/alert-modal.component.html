@if (alert(); as a) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs animate-fade-in"
    (click)="onCancel()"
  >
    <div
      class="bg-white border border-slate-200 rounded-2xl max-w-md w-full shadow-2xl p-6 relative overflow-hidden flex flex-col items-center text-center gap-4 animate-fade-up"
      (click)="$event.stopPropagation()"
    >
      <!-- Accent top glow line (color depends on type) -->
      <div class="absolute top-0 left-0 right-0 h-1" [ngClass]="getGlowClass(a.type)"></div>

      <!-- Icon container -->
      <div
        class="w-12 h-12 rounded-full flex items-center justify-center border shadow-xs flex-shrink-0"
        [ngClass]="getIconClass(a.type)"
      >
        <!-- SUCCESS Checkmark Icon -->
        @if (a.type === 'success') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        }
        <!-- INFO Informational Icon -->
        @if (a.type === 'info') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <!-- WARNING Exclamation Icon -->
        @if (a.type === 'warning') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        }
        <!-- ERROR Close Icon -->
        @if (a.type === 'error') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </div>

      <!-- Content -->
      <div class="flex flex-col gap-1.5 w-full">
        <h3 class="font-display text-xl font-bold text-touche-navy">{{ a.title }}</h3>
        <p class="text-sm text-slate-500 leading-relaxed">{{ a.message }}</p>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-3 w-full mt-2">
        @if (a.showCancel) {
          <button
            type="button"
            id="btn-alert-cancel"
            (click)="onCancel()"
            class="btn-ghost flex-grow py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm font-bold transition-colors"
          >
            {{ a.cancelText || 'Cancelar' }}
          </button>
        }
        <button
          type="button"
          id="btn-alert-confirm"
          (click)="onConfirm()"
          class="flex-grow py-2.5 rounded-xl text-sm font-bold shadow-sm transition-all duration-150"
          [ngClass]="a.isDestructive ? 'btn-danger' : 'btn-navy'"
        >
          {{ a.confirmText || 'Aceptar' }}
        </button>
      </div>
    </div>
  </div>
}
