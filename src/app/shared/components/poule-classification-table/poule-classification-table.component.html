<div class="table-card bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm animate-fade-up">
  <div class="overflow-x-auto">
    <table class="data-table w-full text-left border-collapse text-sm">
      <thead>
        <tr class="border-b border-slate-200 bg-slate-50/50">
          <th class="th-center py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center w-16">Cls.</th>
          <th class="py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Atleta</th>
          <th class="py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Club</th>
          <th class="th-center py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center w-16">V</th>
          <th class="th-center py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center w-16">TA</th>
          <th class="th-center py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center w-16">TR</th>
          <th class="th-center py-3 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center w-20">Ind.</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (s of rows; track s.athleteId; let i = $index) {
          <tr class="hover:bg-slate-50/30 transition-colors">
            <td class="td-center py-3.5 px-4 text-center font-bold text-touche-navy">
              {{ s.rank ?? (i + 1) }}
            </td>
            <td class="py-3.5 px-4 font-semibold text-touche-navy">
              {{ s.fullName }}
            </td>
            <td class="py-3.5 px-4 text-slate-500">
              {{ s.club ?? '—' }}
            </td>
            <td class="td-center py-3.5 px-4 text-center font-bold text-emerald-600">
              {{ s.victories }}
            </td>
            <td class="td-center py-3.5 px-4 text-center text-slate-600">
              {{ s.touchesScored }}
            </td>
            <td class="td-center py-3.5 px-4 text-center text-slate-600">
              {{ s.touchesReceived }}
            </td>
            <td class="td-center py-3.5 px-4 text-center font-bold"
                [ngClass]="s.indicator >= 0 ? 'text-emerald-600' : 'text-red-500'">
              {{ s.indicator >= 0 ? '+' : '' }}{{ s.indicator }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
