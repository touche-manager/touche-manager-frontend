<div class="w-full max-w-3xl mx-auto py-10 px-4">

  <!-- Heading -->
  <div class="mb-10 w-full">
    <a routerLink="/auth/register"
       class="back-link inline-flex items-center gap-1.5 text-sm font-semibold text-touche-celeste mb-6
              hover:underline underline-offset-2">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Volver al registro
    </a>
    <h1 class="page-title">Preguntas Frecuentes</h1>
    <p class="page-subtitle mt-2">Encontrá respuestas a las consultas más comunes</p>
  </div>

  <div class="space-y-8 w-full">
    @for (category of categories; track category.title) {
      <section class="w-full">
        <h2 class="font-display text-xl font-bold text-touche-navy mb-4 pb-2 border-b border-slate-200 w-full">
          {{ category.title }}
        </h2>
        <div class="space-y-2 w-full">
          @for (item of category.items; track item.question) {
            <div class="w-full rounded-xl border border-slate-200 bg-white overflow-hidden
                        shadow-sm transition-shadow hover:shadow-card">
              <!-- Question button -->
              <button
                type="button"
                (click)="toggle(item)"
                class="w-full flex items-center justify-between gap-4 px-5 py-4 text-left
                       hover:bg-touche-slate/50 transition-colors duration-150"
              >
                <span class="text-sm font-semibold text-touche-navy pr-4">{{ item.question }}</span>
                <svg
                  class="h-5 w-5 flex-shrink-0 text-touche-celeste transition-transform duration-200"
                  [class.rotate-180]="item.open()"
                  fill="none" stroke="currentColor" viewBox="0 0 24 24"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 9l-7 7-7-7"/>
                </svg>
              </button>

              <!-- Answer -->
              @if (item.open()) {
                <div class="px-5 pb-4 text-sm text-slate-600 leading-relaxed border-t border-slate-100 pt-3 w-full break-words">
                  {{ item.answer }}
                </div>
              }
            </div>
          }
        </div>
      </section>
    }
  </div>

</div>
