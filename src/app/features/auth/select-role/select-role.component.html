<div class="flex-1 flex items-center justify-center
            bg-touche-navy md:bg-white
            -mx-4 -my-6 md:-mx-6 md:-my-8 px-5 py-10">

  <div class="w-full max-w-sm animate-fade-up">

    <!-- Header -->
    <div class="flex flex-col items-center mb-8">
      <img src="/logo.png" alt="Touché Manager"
           class="h-20 w-20 rounded-full border-2 border-touche-gold/60 shadow-auth object-cover mb-4" />
      <h1 class="font-display text-3xl font-bold text-white md:text-touche-navy">Elegí tu rol</h1>
      <div class="mt-2 w-10 h-0.5 bg-touche-gold rounded-full"></div>
      <p class="mt-3 text-sm text-white/70 md:text-slate-500 text-center max-w-xs">
        Tu cuenta tiene múltiples roles. Seleccioná cómo querés continuar.
      </p>
    </div>

    <!-- Role cards -->
    <div class="space-y-3">
      @for (rol of roles(); track rol) {
        <button
          type="button"
          (click)="selectRole(rol)"
          [disabled]="loading()"
          class="group w-full text-left rounded-2xl p-4
                 bg-white/95 md:bg-white
                 border border-white/20 md:border-slate-200
                 shadow-card hover:shadow-card-hover
                 transition-all duration-200 hover:-translate-y-0.5
                 hover:border-touche-gold/50
                 focus:outline-none focus:ring-2 focus:ring-touche-gold focus:ring-offset-2
                 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0"
        >
          <div class="flex items-center gap-4">

            <!-- Ícono según rol -->
            <div class="flex-shrink-0 h-11 w-11 rounded-xl flex items-center justify-center border
                        transition-all duration-200
                        bg-slate-100 border-slate-200
                        group-hover:bg-touche-navy group-hover:border-touche-navy">
              @if (rol === 'ATHLETE') {
                <svg class="h-5 w-5 text-touche-celeste group-hover:text-white transition-colors"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              }
              @if (rol === 'REFEREE') {
                <svg class="h-5 w-5 text-touche-celeste group-hover:text-white transition-colors"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
              }
              @if (rol === 'ORGANIZER') {
                <svg class="h-5 w-5 text-touche-gold group-hover:text-white transition-colors"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              }


            </div>

            <!-- Texto -->
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-touche-navy">{{ roleLabels[rol] }}</p>
              <p class="text-xs text-slate-500 mt-0.5 leading-snug">{{ roleDescriptions[rol] }}</p>
            </div>

            <!-- Flecha -->
            <svg class="h-4 w-4 text-slate-300 group-hover:text-touche-gold flex-shrink-0
                        transition-all duration-200 group-hover:translate-x-0.5"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </button>
      }
    </div>

    <!-- Loading -->
    @if (loading()) {
      <div class="mt-6 flex items-center justify-center gap-2 text-sm text-white/70 md:text-slate-500">
        <svg class="animate-spin h-4 w-4 text-touche-gold" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        Cargando...
      </div>
    }

    <!-- Error -->
    @if (errorMessage()) {
      <div class="mt-4 alert-danger text-xs">{{ errorMessage() }}</div>
    }

  </div>
</div>
