<div class="flex flex-col gap-6 pb-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 animate-fade-up">
    <div>
      <h1 class="page-title">Panel de Espectador</h1>
      <p class="page-subtitle">Explorá los torneos en curso, resultados y rankings sin registrarte.</p>
    </div>
  </div>

  <!-- Accesos rápidos -->
  <div class="animate-fade-up delay-100">
    <p class="mb-3 text-[11px] font-bold uppercase tracking-widest text-touche-navy/40">Accesos rápidos</p>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <!-- En Vivo -->
      <a
        id="quick-access-live"
        routerLink="/live"
        class="card card-hover group hover:border-red-400/40 p-5
               flex flex-col items-start gap-3 text-left
               focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-1"
      >
        <div class="flex h-11 w-11 items-center justify-center rounded-xl
                    border border-red-400/30 bg-red-50 text-red-500
                    transition-all duration-200
                    group-hover:bg-touche-navy group-hover:text-white group-hover:border-touche-navy">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                  d="M5.636 5.636a9 9 0 1012.728 12.728A9 9 0 005.636 5.636z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-bold leading-tight text-touche-navy">En Vivo</p>
          <p class="mt-1 text-[11px] text-slate-400 group-hover:text-touche-celeste/80 transition-colors">
            Torneos y asaltos en curso
          </p>
        </div>
      </a>

      <!-- Resultados -->
      <a
        id="quick-access-rankings"
        routerLink="/rankings"
        class="card card-hover group hover:border-touche-celeste/40 p-5
               flex flex-col items-start gap-3 text-left
               focus:outline-none focus:ring-2 focus:ring-touche-celeste focus:ring-offset-1"
      >
        <div class="flex h-11 w-11 items-center justify-center rounded-xl
                    border border-touche-celeste/20 bg-touche-celeste/10 text-touche-celeste
                    transition-all duration-200
                    group-hover:bg-touche-navy group-hover:text-white group-hover:border-touche-navy">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                  d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-bold leading-tight text-touche-navy">Resultados</p>
          <p class="mt-1 text-[11px] text-slate-400 group-hover:text-touche-celeste/80 transition-colors">
            Historial de torneos y posiciones
          </p>
        </div>
      </a>

      <!-- Rankings RSP -->
      <a
        id="quick-access-ranking-points"
        routerLink="/rankings/points"
        class="card card-hover group hover:border-touche-gold/40 p-5
               flex flex-col items-start gap-3 text-left
               focus:outline-none focus:ring-2 focus:ring-touche-gold focus:ring-offset-1"
      >
        <div class="flex h-11 w-11 items-center justify-center rounded-xl
                    border border-touche-gold/30 bg-touche-gold/10 text-touche-gold
                    transition-all duration-200
                    group-hover:bg-touche-navy group-hover:text-white group-hover:border-touche-navy">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-bold leading-tight text-touche-navy">Rankings RSP</p>
          <p class="mt-1 text-[11px] text-slate-400 group-hover:text-touche-celeste/80 transition-colors">
            Ranking por puntos acumulados
          </p>
        </div>
      </a>

    </div>
  </div>

</div>
